    <img id="lbImg" src="" alt="">
    <button class="lb-next" id="lbNext">&#8250;</button>
</div>

<script>
    // Size each cell to the photo's real aspect ratio. Your sets only
    // use 5 known ratios, so match each photo to the closest of those
    // rather than guessing with thresholds — every ratio gets its own
    // correctly-shaped cell, none of them share a generic "normal" box.
    const ROW_UNIT = 10; // must match grid-auto-rows in style.css
    const GAP = 16;       // must match var(--space-sm)

    const RATIOS = [
        { name: 'ratio-1-1', value: 1 / 1 },
        { name: 'ratio-4-5', value: 4 / 5 },
        { name: 'ratio-5-4', value: 5 / 4 },
        { name: 'ratio-2-3', value: 2 / 3 },
        { name: 'ratio-3-2', value: 3 / 2 },
    ];

    function closestRatio(actual) {
        return RATIOS.reduce((best, r) =>
            Math.abs(r.value - actual) < Math.abs(best.value - actual) ? r : best
        );
    }

    function classifyRatio(img) {
        const link = img.closest('a');
        const actual = img.naturalWidth / img.naturalHeight;
        const match = closestRatio(actual);
        RATIOS.forEach(r => link.classList.remove(r.name));
        link.classList.add(match.name);
    }

    function computeRowSpan(link) {
        // Only meaningful while the cell is actually visible —
        // a display:none ancestor reads a height of 0.
        requestAnimationFrame(() => {
            const height = link.getBoundingClientRect().height;
            if (!height) return;
            const rowSpan = Math.ceil((height + GAP) / (ROW_UNIT + GAP));
            link.style.gridRowEnd = `span ${rowSpan}`;
        });
    }

    function sizeCell(img) {
        classifyRatio(img);
        const category = img.closest('.photo-category');
        if (category && category.classList.contains('active')) {
            computeRowSpan(img.closest('a'));
        }
    }

    function prepareCategory(category) {
        const images = Array.from(category.querySelectorAll('.photo-grid img'));

        if (!images.length) {
            category.classList.add('gallery-ready');
            return;
        }

        const imagePromises = images.map(img => new Promise(resolve => {
            if (img.complete && img.naturalWidth) {
                sizeCell(img);
                resolve();
            } else {
                img.addEventListener('load', () => {
                    sizeCell(img);
                    resolve();
                }, { once: true });

                img.addEventListener('error', resolve, { once: true });
            }
        }));

        Promise.all(imagePromises).then(() => {
            // Allow the existing row-span calculations to finish before
            // revealing the grid.
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    category.classList.add('gallery-ready');
                });
            });
        });
    }

    document.querySelectorAll('.photo-category').forEach(prepareCategory);

    // Column width changes with viewport size, which changes each
    // cell's real rendered height — recompute row-spans after resize.
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            document.querySelectorAll('.photo-category.active .photo-grid a').forEach(computeRowSpan);
        }, 150);
    });

    // Filter tabs
    const filterButtons = document.querySelectorAll('.photo-filters button');
    const categories = document.querySelectorAll('.photo-category');

    filterButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            filterButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const target = btn.dataset.filter;
            categories.forEach(cat => cat.classList.toggle('active', cat.id === target));
            const shown = document.getElementById(target);
            shown.classList.remove('gallery-ready');
            prepareCategory(shown);
        });
    });

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    let currentLinks = [];
    let currentIndex = 0;

    function openLightbox(links, index) {
        currentLinks = links;
        currentIndex = index;
        lbImg.src = currentLinks[currentIndex].getAttribute('href');
        lightbox.classList.add('open');
    }

    function closeLightbox() {
        lightbox.classList.remove('open');
    }

    function step(dir) {
        currentIndex = (currentIndex + dir + currentLinks.length) % currentLinks.length;
        lbImg.src = currentLinks[currentIndex].getAttribute('href');
    }

    categories.forEach(cat => {
        const links = Array.from(cat.querySelectorAll('.photo-grid a'));
        links.forEach((link, index) => {
            link.addEventListener('click', e => {
                e.preventDefault();
                openLightbox(links, index);
            });
        });
    });

    document.getElementById('lbClose').addEventListener('click', closeLightbox);
    document.getElementById('lbPrev').addEventListener('click', () => step(-1));
    document.getElementById('lbNext').addEventListener('click', () => step(1));
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => {
        if (!lightbox.classList.contains('open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') step(-1);
        if (e.key === 'ArrowRight') step(1);
    });
</script>
